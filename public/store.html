<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>套餐销售登记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23d9804a'/%3E%3Ctext x='32' y='42' fill='%23fbf1e3' font-family='Georgia,serif' font-weight='700' font-size='27' text-anchor='middle'%3E365%3C/text%3E%3C/svg%3E">
<!-- 店员手机页：照抖音看板门店页的语言（白底、发丝线、直角、Didot 只给数字、粉只给要注意的量） -->
<style>
:root{--line:#F0EDE6;--line-2:#E3DFD6;--paper:#FAFAF8;--ink:#16140F;--t2:#4A453C;--t3:#9C958A;--t4:#B4ADA1;
  --pink-deep:#B9808B;--chip:#DAD4C8;--pink:#D9A6AE;--brand:#B9808B;--dp-sel:#B9808B;--pink-bg:#FAF2F3;--done:#2F5D45;--done-bg:rgba(47,93,69,.08);
  --sans:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;--num:Didot,"Bodoni 72",Georgia,"Songti SC",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);color:var(--ink);background:#fff;position:relative;-webkit-font-smoothing:antialiased;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
canvas.fx-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.top,.wrap{position:relative;z-index:1}
.top{background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;position:relative;height:56px;border-bottom:1px solid var(--line-2)}
.top img{height:22px}
.top .out{position:absolute;right:14px;border:0;background:none;font-size:13px;color:var(--t3)}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
h2{font-size:22px;font-weight:500;letter-spacing:.05em;margin:24px 0 4px}
.sub{font-size:13px;color:var(--t3)}
.form{margin-top:22px;border-top:1px solid var(--line-2)}
.form .row,.list .it,.list h3{background:rgba(255,255,255,.9)}
.row:focus-within{border-bottom-color:var(--pink-deep)}
.row:focus-within label{color:var(--pink-deep)}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:56px}
.row label{width:84px;flex:none;font-size:14px;color:var(--t2)}
/* 续卡的「原卡到期日」要跟开卡日期区分开、引起注意（2026-11-12 用户）：橙红加粗 + 淡橙底 + 左侧色条 */
.row.warn,.form .row.warn{background:#FFF4EC;box-shadow:inset 3px 0 0 #D2642A}
.row.warn label,.row.warn:focus-within label{color:#D2642A;font-weight:600;padding-left:10px}
.row.warn:focus-within,.row.warn{border-bottom-color:#D2642A}
.row input{flex:1;border:0;outline:none;padding:14px 0;font-size:17px;background:transparent;min-width:0}
.row input::placeholder{color:var(--t4)}
.row input.num{font-family:var(--num);font-size:19px}
.row select{flex:1;border:0;outline:none;padding:14px 0;font-size:17px;background:transparent;min-width:0;-webkit-appearance:none;appearance:none;color:var(--ink)}
.row select:invalid{color:var(--t4)}
.row .xs-btn{flex:1;border:0;height:auto;padding:14px 0;font-size:17px;min-width:0}
.row .xs-btn svg{margin-right:4px}
.row .tip{font-size:12px;color:var(--t3);margin-left:8px;flex:none}
.seg{display:flex;flex:1;border:1px solid var(--chip);background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:15px;color:var(--t2)}
.seg button+button{border-left:1px solid var(--chip)}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}   /* 2026-11-11 用户：店员版按钮用赫眉粉；同日又说色系照抖音看板登录页 → 深粉 #B9808B + 背景粉色光丝 */
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;padding:12px 0}
.pk button{border:1px solid var(--chip);background:#fff;padding:10px 6px;text-align:center;line-height:1.45}
.pk button b{display:block;font-weight:500;font-size:13px;white-space:nowrap;letter-spacing:-.02em}
.pk button i{font-style:normal;font-family:var(--num);font-size:16px;color:var(--t2)}
.pk button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pk button.on i{color:#fff}
.row[hidden]{display:none}
/* 四个类型（2026-11-12 加退货）两行两列，手机上一行放四个字太挤 */
.seg.k4{display:grid;grid-template-columns:1fr 1fr;margin:10px 0}
.seg.k4 button+button{border-left:0}
.seg.k4 button:nth-child(even){border-left:1px solid var(--chip)}
.seg.k4 button:nth-child(n+3){border-top:1px solid var(--chip)}
.seg.k4 button[data-v=refund].on{background:var(--t2);border-color:var(--t2)}
.qty{display:flex;align-items:center;border:1px solid var(--chip);background:#fff}
.qty button{width:46px;height:42px;border:0;background:#fff;font-size:20px;color:var(--t2)}
.qty input{width:56px;text-align:center;border:0;border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:8px 0;font-family:var(--num);font-size:19px;outline:none}
.row textarea{flex:1;border:1px solid var(--chip);outline:none;padding:10px;font:inherit;font-size:16px;margin:12px 0;min-height:76px;resize:vertical;background:#fff}
.row textarea:focus{border-color:var(--pink-deep)}
.storeline{display:flex;align-items:baseline;gap:10px}
.storeline b{font-weight:500;color:var(--ink)}
.storeline a{color:var(--t3);text-decoration:underline;font-size:12px}
.bad{color:var(--pink-deep)!important}
.go{width:100%;margin-top:24px;background:var(--brand);color:#fff;border:0;padding:16px;font-size:16px;letter-spacing:.12em}
.go:disabled{background:var(--t4)}
.msg{min-height:22px;margin-top:12px;font-size:14px;text-align:center}
.msg.ok{color:var(--done)} .msg.err{color:var(--pink-deep)}
.list{margin-top:30px}
.list h3{font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--t3);padding-bottom:10px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between}
.list h3 b{font-family:var(--num);font-size:15px;font-weight:400;color:var(--ink);letter-spacing:0}
.it{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.it .m{flex:1;min-width:0}
.it .n{font-size:15px}
.it .p{font-family:var(--num);font-size:15px;color:var(--t2);margin-left:6px}
.it .d{font-size:12px;color:var(--t3);margin-top:3px}
.st{font-size:12px;padding:3px 8px;flex:none}
.st.pending{color:var(--pink-deep);background:var(--pink-bg)}
.st.done{color:var(--done);background:var(--done-bg)}
.del{border:1px solid var(--line-2);background:#fff;font-size:12px;padding:4px 10px;color:var(--t3);flex:none}
.del.sure{border-color:var(--pink-deep);color:var(--pink-deep)}
.empty{padding:30px 0;text-align:center;color:var(--t4);font-size:13px}
.row .dp-btn{font-size:19px}
.gsw{display:inline-block;
  /* 跟操作员页侧栏「365 金卡」同一道金光（黑字上淡金光每 5 秒扫过一次），2026-11-11 用户要店员版也加 */
  background:linear-gradient(100deg,#16140F 0%,#16140F 40%,#C9A15A 48%,#F0D9A8 50%,#C9A15A 52%,#16140F 60%,#16140F 100%);
  background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gsw 5s ease-in-out 0.8s infinite}
@keyframes gsw{0%{background-position:100% 0}40%,100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.gsw{animation:none;color:#16140F;background:none}}
</style>
</head>
<body>
<div class="top"><img src="logo-ink.png" alt="赫眉 HYMN"><button class="out" id="out" type="button">退出</button></div>
<div class="wrap">
  <h2><span class="gsw">套餐销售登记</span></h2>
  <div class="sub storeline"><b id="storeName">—</b><a id="chStore" href="javascript:">换门店</a></div>

  <form class="form" id="f" autocomplete="off">
    <!-- 门店在登录页选（2026-11-12 用户）；工号下拉只列这家店的。操作员用店员版时这里多一行选门店（店员看不到） -->
    <div class="row" id="opStoreRow" hidden><label>门店</label><select id="opStore"><option value="">选门店</option></select><span class="tip">后台</span></div>
    <div class="row"><label>工号</label><select id="no"><option value="">选你的工号</option></select><span class="tip">会记住</span></div>
    <div class="row"><label>类型</label><div class="seg k4" id="kind"><button type="button" data-v="new">新开365卡</button><button type="button" data-v="renew">365续卡</button><button type="button" data-v="other">其它</button><button type="button" data-v="refund">退货</button></div></div>
    <div class="row" id="pkRow" hidden><label>套餐</label><div class="pk" id="pk"></div></div>
    <!-- 套餐数量（2026-11-12 用户：默认 1，可以改） -->
    <div class="row" id="qtyRow" hidden><label>数量</label><div class="qty"><button type="button" id="qm">−</button><input id="qty" class="num" inputmode="numeric" value="1" maxlength="2"><button type="button" id="qp">＋</button></div><span class="tip" style="margin-left:12px">份</span></div>
    <!-- 送朋友（2026-11-12 用户）：送的人、被送的人都填名字电话；卡办在被送的人名下 -->
    <div class="row" id="giftRow" hidden><label>给谁办</label><div class="seg" id="gift"><button type="button" data-v="0">自己</button><button type="button" data-v="1">送朋友</button></div></div>
    <div class="row" id="gnRow" hidden><label>送的人</label><input id="gname" placeholder="送的人姓名" maxlength="30"></div>
    <div class="row" id="gpRow" hidden><label>送的人手机</label><input id="gphone" class="num" type="tel" inputmode="numeric" placeholder="11 位手机号" maxlength="13"></div>
    <div class="row" id="noteRow" hidden><label>备注</label><textarea id="note" maxlength="200" placeholder="写清楚办的是什么"></textarea></div>
    <div class="row"><label id="nlab">会员姓名</label><input id="name" placeholder="姓名" maxlength="30"></div>
    <div class="row"><label id="plab">手机号</label><input id="phone" class="num" type="tel" inputmode="numeric" placeholder="11 位手机号" maxlength="13" required></div>
    <!-- 会员生日（2026-11-12 用户：新开365卡加会员生日），只在新开卡时出现、必填；送朋友时填被送的人的 -->
    <div class="row" id="bdRow" hidden><label id="blab">会员生日</label><input id="birth" class="num" type="date" data-dp="birth"></div>
    <div class="row"><label id="dlab">开卡日期</label><input id="date" class="num" type="date"></div>
    <button class="go" id="go" type="submit">提交</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="list">
    <h3><span id="lt">我提交的 · 近 30 天</span><b id="cnt"></b></h3>
    <div id="items"><div class="empty">选了工号就能看到自己提交过的</div></div>
  </div>
  <!-- 版本号（2026-11-12 用户：右上角碍眼，放到页面最底下，同 VIP 店员版）：部署时 bump.sh 写入 -->
  <div style="margin:36px 0 8px;text-align:center;font-size:11px;letter-spacing:.05em;color:var(--t4);position:relative;z-index:1"><span id="verB">版本 2026.11.14 10:59</span></div>
</div>

<script src="fx.js?v=202611141059"></script>
<script>try { hymnBgFx({ count: 460, alpha: 0.9 }); } catch (e) {}   // 背景竖向光丝（赫眉粉系），照抖音看板登录页</script>
<script src="stores.js?v=202611141059"></script>
<script src="xsel.js?v=202611141059"></script>
<script src="datepick.js?v=202611141059"></script>
<script src="api.js?v=202611141059"></script>
<script>
const $ = s => document.querySelector(s);
document.querySelectorAll('input[type=date]').forEach(el => DatePick.attach(el));
// 自画下拉，手机上从底部弹出。最后一项「其它」：点了在同一个列表里展开所有门店的人 + 搜索框（2026-11-13 用户：别再加一行）
const OTHER = '*';
XSel.attach($('#no'), { placeholder: true, more: OTHER });
const staffNo = () => $('#no').value;
$('#pk').innerHTML = PKGS.map((p, i) => `<button type="button" data-i="${i}"><b>${p[0]}</b><i>${p[1]}</i></button>`).join('');
let STORE = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const nextMonth1 = new Date(today.getFullYear(), today.getMonth() + 1, 1);
const ymd = s => s.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/, '$1/$2/$3');

// 刷新不丢：工号一直记着（按门店）；办卡 / 套餐 / 备注 / 姓名 / 手机号 / 日期当天记着。
// 办卡和套餐每单都要自己选（2026-11-12 用户：必须选），提交完清空
const KEY = 'c365_store';
let kind = '', pkg = -1, gift = false, dateTouched = false, sv = {};
try {
  sv = JSON.parse(localStorage.getItem(KEY) || '{}');
  if (sv.day === iso(today)) {
    kind = sv.kind || ''; pkg = sv.pkg != null ? sv.pkg : -1; gift = !!sv.gift; $('#qty').value = sv.qty || 1; $('#note').value = sv.note || ''; $('#gname').value = sv.gname || ''; $('#gphone').value = sv.gphone || ''; $('#birth').value = sv.birth || '';
    $('#name').value = sv.name || ''; $('#phone').value = sv.phone || ''; if (sv.date) { $('#date').value = sv.date; dateTouched = true; }
  }
} catch (e) {}
function save() {
  const nos = Object.assign({}, sv.nos || {}); if (STORE) nos[STORE] = $('#no').value;
  sv = { nos, kind, pkg, qty: $('#qty').value, gift, gname: $('#gname').value, gphone: $('#gphone').value, birth: $('#birth').value, note: $('#note').value, name: $('#name').value, phone: $('#phone').value, date: dateTouched ? $('#date').value : '', day: iso(today) };
  try { localStorage.setItem(KEY, JSON.stringify(sv)); } catch (e) {}
}
function paintKind() {
  document.querySelectorAll('#kind button').forEach(b => b.classList.toggle('on', b.dataset.v === kind));
  document.querySelectorAll('#pk button').forEach(b => b.classList.toggle('on', +b.dataset.i === pkg));
  $('#pkRow').hidden = !(kind === 'new' || kind === 'renew' || kind === 'refund');   // 退货也选套餐（2026-11-12 用户）
  $('#noteRow').hidden = kind !== 'other' && kind !== 'refund';
  $('#note').placeholder = kind === 'refund' ? '选填：退了什么、为什么退' : '写清楚办的是什么';
  const g = gift && (kind === 'new' || kind === 'renew');
  $('#giftRow').hidden = !(kind === 'new' || kind === 'renew');
  $('#qtyRow').hidden = !(kind === 'new' || kind === 'renew' || kind === 'refund');
  document.querySelectorAll('#gift button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === gift));
  $('#gnRow').hidden = $('#gpRow').hidden = !g;
  $('#bdRow').hidden = kind !== 'new'; $('#blab').textContent = g ? '被送人生日' : '会员生日';
  $('#nlab').textContent = g ? '被送的人' : '会员姓名'; $('#name').placeholder = g ? '被送的人姓名' : '姓名';
  $('#plab').textContent = g ? '被送人手机' : '手机号';
  // 续卡填「原卡到期日」（2026-11-12 用户），新卡从这天算；要店员自己选，不给默认
  $('#dlab').closest('.row').classList.toggle('warn', kind === 'renew');
  $('#dlab').textContent = kind === 'renew' ? '原卡到期日' : kind === 'other' ? '日期' : kind === 'refund' ? '退货日期' : '开卡日期';
  $('#nlab').textContent = g ? '被送的人' : kind === 'refund' ? '顾客姓名' : '会员姓名';
  if (!dateTouched) $('#date').value = kind === 'renew' ? '' : iso(today);
}
document.querySelectorAll('#kind button').forEach(b => b.onclick = () => { kind = b.dataset.v; dateTouched = false; paintKind(); save(); if (kind === 'other') $('#note').focus(); });
document.querySelectorAll('#pk button').forEach(b => b.onclick = () => { pkg = +b.dataset.i; paintKind(); save(); });
$('#note').oninput = save;
document.querySelectorAll('#gift button').forEach(b => b.onclick = () => { gift = b.dataset.v === '1'; paintKind(); save(); if (gift) $('#gname').focus(); });
$('#gname').oninput = save; $('#gphone').oninput = save; $('#birth').oninput = save;
const qtyN = () => Math.min(99, Math.max(1, parseInt($('#qty').value, 10) || 1));
$('#qm').onclick = () => { $('#qty').value = Math.max(1, qtyN() - 1); save(); };
$('#qp').onclick = () => { $('#qty').value = Math.min(99, qtyN() + 1); save(); };
$('#qty').oninput = () => { $('#qty').value = $('#qty').value.replace(/\D/g, '').slice(0, 2); save(); };
$('#qty').onblur = () => { $('#qty').value = qtyN(); save(); };
paintKind();

const phoneOf = () => $('#phone').value.replace(/\D/g, '');
$('#phone').oninput = () => { $('#phone').classList.toggle('bad', phoneOf().length > 0 && !/^1\d{10}$/.test(phoneOf()) && phoneOf().length >= 11); save(); };
$('#name').oninput = save;
$('#date').oninput = () => { dateTouched = true; save(); };
$('#no').onchange = () => { save(); load(); };

function msg(t, ok) { $('#msg').textContent = t; $('#msg').className = 'msg ' + (ok ? 'ok' : 'err'); }

$('#f').onsubmit = async e => {
  e.preventDefault();
  const no = staffNo(), phone = phoneOf();
  if (IS_OP && !STORE) return msg('请先选门店');
  if (!no) return msg('请先选工号');
  if (!kind) return msg('请选新开365卡 / 365续卡 / 其它 / 退货');
  const flat = kind === 'other';
  if (!flat && pkg < 0) return msg(kind === 'refund' ? '请选退的是哪个套餐' : '请选套餐');
  if (kind === 'refund' && !$('#name').value.trim()) { $('#name').focus(); return msg('退货请填顾客姓名'); }
  if (kind === 'other' && !$('#note').value.trim()) { $('#note').focus(); return msg('选了其它，请写备注'); }
  const g = gift && !flat && kind !== 'refund', gp = $('#gphone').value.replace(/\D/g, '');
  if (g && !$('#gname').value.trim()) { $('#gname').focus(); return msg('请填送的人姓名'); }
  if (g && !/^1\d{10}$/.test(gp)) { $('#gphone').focus(); return msg('送的人手机号要 11 位'); }
  if (g && !$('#name').value.trim()) { $('#name').focus(); return msg('请填被送的人姓名'); }
  if (kind === 'new' && !$('#birth').value) return msg(g ? '请选被送人生日' : '请选会员生日');
  if (kind === 'new' && $('#birth').value > iso(today)) return msg('生日不能晚于今天，请重选年份');
  if (kind === 'renew' && !$('#date').value) return msg('请选原卡到期日');
  if (!/^1\d{10}$/.test(phone)) { $('#phone').classList.add('bad'); return msg('手机号要 11 位'); }
  if (!$('#date').value) return msg('请选日期');
  $('#go').disabled = true; msg('');
  try {
    await api('/sub', { store: STORE, staff_no: no, name: $('#name').value.trim(), phone, sdate: $('#date').value, kind, pkg: flat ? '' : PKG_NAMES[pkg], qty: flat ? null : qtyN(), note: flat || kind === 'refund' ? $('#note').value.trim() : '', gift: g, giver_name: g ? $('#gname').value.trim() : '', giver_phone: g ? gp : '', birth: kind === 'new' ? $('#birth').value : '' });
    msg('已提交：' + ($('#name').value.trim() || phone), true);
    $('#name').value = ''; $('#phone').value = ''; $('#note').value = ''; $('#qty').value = 1; $('#gname').value = ''; $('#gphone').value = ''; $('#birth').value = ''; kind = ''; pkg = -1; gift = false; dateTouched = false; paintKind(); save();
    load();
  } catch (err) { msg(err.message); }
  $('#go').disabled = false;
};

async function load() {
  const no = staffNo();
  $('#lt').textContent = no ? `工号 ${no} 提交的 · 近 30 天` : '我提交的 · 近 30 天';
  if (!no) { $('#items').innerHTML = '<div class="empty">选了工号就能看到自己提交过的</div>'; $('#cnt').textContent = ''; return; }
  try {
    const { subs } = await api('/subs?staff_no=' + encodeURIComponent(no) + (IS_OP ? '&store=' + encodeURIComponent(STORE) : ''));
    $('#cnt').textContent = subs.length || '';
    $('#items').innerHTML = subs.length ? subs.map(s => `<div class="it">
      <div class="m"><span class="n">${esc(s.name || '未填姓名')}</span><span class="p">${s.phone}</span>
        <div class="d">${s.kind === 'refund' ? '退货 · ' + esc(s.pkg || '') + (s.qty > 1 ? ' ×' + s.qty : '') + ' · ' + ymd(s.sdate) + (s.note ? ' · ' + esc(s.note) : '') : s.kind === 'other' ? '其它：' + esc(s.note || '') + ' · ' + ymd(s.sdate) : KIND_NAME[s.kind] + (s.pkg ? ' · ' + esc(s.pkg) + (s.qty > 1 ? ' ×' + s.qty : '') : '') + (s.kind === 'renew' ? ' · 原卡到期 ' + ymd(s.sdate) : ' · ' + ymd(s.sdate)) + (s.giver_phone ? ' · ' + esc(s.giver_name || '') + ' 送的' : '')}　提交于 ${new Date(s.created).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div></div>
      <span class="st ${s.status}">${s.status === 'done' ? '已处理' : '待处理'}</span>
      ${s.status === 'pending' ? `<button class="del" data-id="${s.id}" type="button">删除</button>` : ''}</div>`).join('')
      : '<div class="empty">还没有提交过</div>';
    // 删除要点两下，防误触
    document.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = '确定删除'; setTimeout(() => { b.classList.remove('sure'); b.textContent = '删除'; }, 3000); return; }
      try { await api('/sub/del', { id: +b.dataset.id, staff_no: no }); load(); } catch (err) { msg(err.message); }
    });
  } catch (err) { $('#items').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}
$('#out').onclick = logout;
$('#chStore').onclick = logout;   // 换门店 = 退出重新登录选
let IS_OP = false;
async function loadStaff() {
  const { staff } = await api(IS_OP ? '/staff?store=' + encodeURIComponent(STORE) : '/staff');
  let all = [];
  try { all = (await api('/staff?all=1')).staff.filter(x => !staff.some(y => y.no === x.no)); } catch (e) {}
  const by = {}; all.forEach(x => (by[x.store] = by[x.store] || []).push(x));
  $('#no').innerHTML = '<option value="">选你的工号</option>' + staff.map(x => `<option value="${esc(x.no)}">${esc(x.no)}　${esc(x.name || '')}</option>`).join('') +
    (all.length ? `<option value="${OTHER}">其它（别的店的人）</option>` : '') +
    Object.keys(by).map(st => `<optgroup label="${esc(st)}" data-more="1">${by[st].map(x => `<option value="${esc(x.no)}">${esc(x.no)}　${esc(x.name || '')}　· ${esc(st)}</option>`).join('')}</optgroup>`).join('');
  const keep = (sv.nos || {})[STORE];
  $('#no').value = keep && keep !== OTHER && [...$('#no').options].some(o => o.value === keep) ? keep : '';
  load();
}
api('/me').then(async r => {
  // 操作员也能用店员版（2026-11-12 用户）：门店在页面上选（记在本机），顶上「换门店」换成「回后台」
  if (r.role === 'op') {
    IS_OP = true;
    $('#opStore').insertAdjacentHTML('beforeend', STORES.map(([m, list]) => `<optgroup label="${m}">${list.map(x => `<option>${x}</option>`).join('')}</optgroup>`).join(''));
    const k = localStorage.getItem('c365_op_store'); if (k && STORE_MGR[k]) $('#opStore').value = k;
    XSel.attach($('#opStore'), { placeholder: true });
    $('#opStoreRow').hidden = false;
    $('#out').onclick = async () => { try { await api('/logout', {}); } catch (e) {} location.href = '/login.html?to=/'; };   // 操作员退出回后台登录页
    $('#chStore').textContent = '回后台'; $('#chStore').onclick = () => { location.href = '/'; };
    const pick = () => { STORE = $('#opStore').value; localStorage.setItem('c365_op_store', STORE); $('#storeName').textContent = STORE ? '操作员 · ' + STORE : '操作员 · 先选门店'; if (STORE) loadStaff(); else { $('#no').innerHTML = '<option value="">选你的工号</option>'; load(); } };
    $('#opStore').onchange = pick; pick();
    return;
  }
  if (r.role !== 'staff' || !r.store) return logout();   // 老会话没选过门店：退出重登
  STORE = r.store; $('#storeName').textContent = r.store;
  loadStaff();
}).catch(() => {});
</script>
