<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>365金卡导入表 · 赫眉</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23d9804a'/%3E%3Ctext x='32' y='42' fill='%23fbf1e3' font-family='Georgia,serif' font-weight='700' font-size='27' text-anchor='middle'%3E365%3C/text%3E%3C/svg%3E">
<!-- 风格照 hymn-douyin-board：纯白底、发丝线分区、直角无阴影、数字用 Didot、粉只做点缀 -->
<style>
:root{
  --bg:#FFFFFF; --paper:#FAFAF8; --line:#F0EDE6; --line-2:#E3DFD6;
  --ink:#16140F; --t1:#16140F; --t2:#4A453C; --t3:#9C958A; --t4:#B4ADA1;
  --pink:#D9A6AE; --pink-deep:#B9808B; --pink-bg:#FAF2F3;
  --sans:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --num:Didot,"Bodoni 72",Georgia,"Songti SC",serif;
  --nav-w:214px; --track:.06em;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--t1);background:var(--bg);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}

.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);border-right:1px solid var(--line-2);background:#fff;display:flex;flex-direction:column}
.sidebar .logo{padding:34px 22px 26px;border-bottom:1px solid var(--line-2)}
.sidebar .logo img{height:30px;display:block}
.sidebar .logo .st{margin-top:10px;font-size:10px;letter-spacing:.32em;color:var(--t3)}
.nav{padding:18px 0}
.nav .grp{padding:14px 22px 8px;font-size:11px;letter-spacing:.2em;color:var(--t4)}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 22px;color:var(--t2);text-decoration:none;border-left:2px solid transparent;cursor:default}
.nav a.on{color:var(--t1);border-left-color:var(--ink);background:var(--paper)}
.nav .ico{display:flex}
.sidebar .foot{margin-top:auto;padding:18px 22px;border-top:1px solid var(--line-2);font-size:12px;color:var(--t3);line-height:1.8}

.main{margin-left:var(--nav-w);padding:44px 52px 80px;max-width:1280px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:26px;border-bottom:1px solid var(--line-2)}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--t3)}
.pagehead h2{font-size:30px;font-weight:500;letter-spacing:var(--track);margin:6px 0 4px}
.pagehead p{color:var(--t3);font-size:13px}

.sec{margin-top:34px}
.sec h3{font-size:12px;font-weight:500;letter-spacing:.2em;color:var(--t3);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec h3 .n{font-family:var(--num);font-size:15px;color:var(--t1);letter-spacing:0}

/* 会员输入：左边整块粘贴，右边实时识别结果 */
.inbox{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);height:340px}
.drop{position:relative;border-right:1px solid var(--line-2)}
.drop textarea{width:100%;height:100%;border:0;padding:16px 18px;outline:none;resize:none;line-height:1.9;font-size:14px;background:transparent}
.drop textarea::placeholder{color:var(--t4)}
.drop textarea:focus{background:var(--paper)}
.dropmask{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--pink-bg);border:1px dashed var(--pink-deep);color:var(--pink-deep);letter-spacing:.12em}
.drop.over .dropmask{display:flex}
.parsed{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--paper);font-size:13px;color:var(--t2)}
.phd span{flex:1}
.phd b{font-family:var(--num);font-size:17px;font-weight:400;color:var(--t1);margin:0 2px}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.file{display:inline-block}
.issues{font-size:12px;max-height:118px;overflow:auto;flex:none;border-bottom:1px solid var(--line-2)}
.issues:empty{display:none}
.issues div{padding:6px 14px;background:var(--pink-bg);color:var(--pink-deep);border-bottom:1px solid var(--line)}
.issues i{font-style:normal;font-family:var(--num);margin-right:8px}
.plist{overflow:auto;flex:1}
.plist table td{padding:6px 14px}
.plist td.i{color:var(--t4);font-family:var(--num);width:46px}
.plist td.nm.none{color:var(--t4)}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-2);background:#fff;padding:9px 18px;cursor:pointer;letter-spacing:var(--track);font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink);padding:13px 30px;font-size:14px}
.btn.pri:disabled{background:var(--t4);border-color:var(--t4);cursor:not-allowed}
.hint{font-size:12px;color:var(--t3)}

/* 设置 */
.opts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2)}
.opt{padding:16px 20px;border-left:1px solid var(--line-2)}
.opt:first-child{border-left:0}
.opt label{display:block;font-size:12px;color:var(--t3);letter-spacing:.12em;margin-bottom:8px}
.opt input{border:0;border-bottom:1px solid var(--line-2);padding:4px 0;outline:none;font-family:var(--num);font-size:20px;width:100%;background:transparent}
.opt input:focus{border-bottom-color:var(--ink)}
.seg{display:flex;border:1px solid var(--line-2)}
.seg button{flex:1;border:0;background:#fff;padding:8px 6px;cursor:pointer;font-size:13px;color:var(--t2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:#fff}
.rule{display:flex;align-items:baseline;gap:6px;padding:4px 0 5px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.rule b{font-family:var(--num);font-size:20px;font-weight:400}
.rule i{font-style:normal;font-size:12px;color:var(--t3);border:1px solid var(--line-2);padding:0 6px}
.opt .sub{font-size:12px;color:var(--t3);margin-top:8px}

/* 概览数字 */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2)}
.tile{padding:18px 20px;border-left:1px solid var(--line-2)}
.tile:first-child{border-left:0}
.tile .k{font-size:12px;color:var(--t3);letter-spacing:.12em}
.tile .v{font-family:var(--num);font-size:30px;line-height:1.3;margin-top:4px}
.tile .v small{font-size:14px;color:var(--t3);margin-left:4px;font-family:var(--sans)}
.tile .v.pk{color:var(--pink-deep)}

/* 预览表 */
.pv{border:1px solid var(--line-2);max-height:560px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:var(--paper);font-weight:500;color:var(--t2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:12px}
td{padding:7px 12px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--num);font-size:14px}
tr.grp td{background:var(--pink-bg);color:var(--t1);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line-2)}
tr.grp td .ph{font-family:var(--num);font-weight:400;margin-left:10px;color:var(--t2)}
tr.wash td:first-child{border-left:2px solid var(--pink)}
.empty{padding:50px;text-align:center;color:var(--t4)}

.bar{position:sticky;bottom:0;margin-top:34px;padding:18px 0;background:rgba(255,255,255,.96);border-top:1px solid var(--line-2);display:flex;align-items:center;gap:18px}
.bar .fn{font-size:13px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <img src="logo-ink.png" alt="赫眉 HYMN">
    <div class="st">STUDIO</div>
  </div>
  <nav class="nav">
    <div class="grp">会员</div>
    <a class="on"><span class="ico"><svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2.5" y="5" width="17" height="12"/><line x1="2.5" y1="9" x2="19.5" y2="9"/><line x1="5.5" y1="13.5" x2="10" y2="13.5"/></svg></span><span>365金卡导入表</span></a>
  </nav>
  <div class="foot">每人 42 张券<br>洗脸巾 12 张 · 代金券 30 张<br>另附 3 次护理导入</div>
</aside>

<div class="main">
  <header class="pagehead">
    <div>
      <div class="eyebrow">赫眉 HYMN · 会员卡项</div>
      <h2>365金卡 导入表生成</h2>
      <p>填姓名和手机号，一键导出系统导入用的 Excel（.xls）</p>
    </div>
  </header>

  <section class="sec">
    <h3>开卡会员 <span class="n" id="pCount">0</span></h3>
    <div class="inbox">
      <div class="drop" id="drop">
        <textarea id="txt" spellcheck="false" placeholder="直接粘贴名单，每行一人：&#10;张三 18968256111&#10;李四，13800000000&#10;18900000000（没有姓名也行）&#10;&#10;从 Excel 复制「姓名、手机号」两列粘进来就行，几百人也一次搞定。&#10;也可以把 Excel 文件直接拖到这里。"></textarea>
        <div class="dropmask">松手，读取这个 Excel</div>
      </div>
      <div class="parsed">
        <div class="phd"><span id="okLine">还没有名单</span>
          <label class="btn sm file">选 Excel 文件<input type="file" id="file" accept=".xls,.xlsx,.csv" hidden></label>
          <button class="btn sm" id="clear" type="button">清空</button></div>
        <div class="issues" id="issues"></div>
        <div class="plist" id="plist"></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <h3>设置</h3>
    <div class="opts">
      <div class="opt">
        <label>开卡日期</label>
        <input type="date" id="date">
        <div class="sub" id="dateSub"></div>
      </div>
      <div class="opt">
        <label>券号规则</label>
        <div class="rule"><b>365</b><i>年份</i><b>手机号</b><i>01–42</i></div>
        <div class="sub" id="noSub"></div>
      </div>
      <div class="opt">
        <label>洗脸巾 12 张怎么分月</label>
        <div class="seg" id="mode">
          <button type="button" data-v="calendar" class="on">按自然月</button>
          <button type="button" data-v="rolling">按开卡日满月</button>
        </div>
        <div class="sub" id="modeSub"></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <h3>概览</h3>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="sec">
    <h3>代金券页预览 <span class="hint" id="pvHint" style="letter-spacing:0"></span></h3>
    <div class="pv" id="pv"></div>
  </section>

  <div class="bar">
    <button class="btn pri" id="go" type="button">导出 Excel</button>
    <span class="fn" id="fn"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="gen.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
$('#date').value = iso(today);

let people = [];      // 识别出的有效名单（已去重）
let mode = 'calendar';

// 每行找一个 11 位手机号，剩下的字当姓名；找不到的、重复的列进「问题」
function parse(text) {
  const ok = [], issues = [], seen = {};
  text.split(/\r?\n/).forEach((line, i) => {
    const raw = line.trim();
    if (!raw) return;
    // 先找连着写的 11 位，再找 138-0000-1111 / 138 0000 1111 这种分段写法
    const m = raw.match(/(?<!\d)1\d{10}(?!\d)/) || raw.match(/(?<!\d)1\d{2}[\s-]\d{4}[\s-]\d{4}(?!\d)/);
    if (!m) {
      if (/^(姓名|名字|手机|电话|会员)/.test(raw)) return;   // 表头行，跳过不算错
      return issues.push({ n: i + 1, raw, why: /\d{6,}/.test(raw) ? '手机号不是 11 位' : '没找到手机号' });
    }
    const phone = m[0].replace(/\D/g, '');
    const name = raw.replace(m[0], ' ').replace(/[\s,，;；、:：|]+/g, ' ').trim();
    if (seen[phone]) return issues.push({ n: i + 1, raw, why: `和第 ${seen[phone]} 行重复，已跳过` });
    seen[phone] = i + 1;
    ok.push({ name, phone });
  });
  return { ok, issues };
}

const okPhone = s => /^1\d{10}$/.test(s);
function curDate() { const [y, m, d] = $('#date').value.split('-').map(Number); return y ? new Date(y, m - 1, d) : today; }

function update() {
  const { ok, issues } = parse($('#txt').value);
  people = ok;
  const date = curDate();
  const opt = { date, mode };
  const vn = (p, k) => Gen.voucherNo(date, p.phone, k);
  const per = Gen.WASH + Gen.CASH;
  const total = people.length * per;
  const oneYear = Gen.addMonths(date, 12);

  $('#pCount').textContent = people.length;
  $('#okLine').innerHTML = people.length ? `识别 <b>${people.length}</b> 人` + (issues.length ? `，<b style="color:var(--pink-deep)">${issues.length}</b> 行有问题` : '') : (issues.length ? `<b style="color:var(--pink-deep)">${issues.length}</b> 行有问题` : '还没有名单');
  $('#issues').innerHTML = issues.slice(0, 50).map(x => `<div><i>第${x.n}行</i>${esc(x.raw.slice(0, 30))} · ${x.why}</div>`).join('');
  $('#plist').innerHTML = people.length ? '<table><tbody>' + people.map((p, i) => {
    return `<tr><td class="i">${i + 1}</td><td class="nm ${p.name ? '' : 'none'}">${esc(p.name || '未填姓名')}</td><td class="num">${p.phone}</td><td class="num" style="color:var(--t3)">${vn(p, 1)}…</td></tr>`;
  }).join('') + '</tbody></table>' : '';

  $('#dateSub').textContent = `代金券有效期 ${Gen.ymd(date)} – ${Gen.ymd(oneYear)}`;
  $('#noSub').textContent = `如 ${Gen.voucherNo(date, '18968256111', 1)}，哪台电脑生成都不撞号；同一人同一年再开卡会重号`;
  const w = Gen.buildRows([{ phone: '0' }], opt);
  $('#modeSub').textContent = `第 1 张 ${Gen.ymd(w[0].s)}–${Gen.ymd(w[0].e)}，第 2 张 ${Gen.ymd(w[1].s)}–${Gen.ymd(w[1].e)}`;

  $('#tiles').innerHTML = `
    <div class="tile"><div class="k">会员</div><div class="v">${people.length}<small>人</small></div></div>
    <div class="tile"><div class="k">代金券行数</div><div class="v">${total}<small>行</small></div></div>
    <div class="tile"><div class="k">每人券数</div><div class="v">${per}<small>张 · 洗脸巾 ${Gen.WASH} + 代金券 ${Gen.CASH}</small></div></div>
    <div class="tile"><div class="k">有效至</div><div class="v pk" style="font-size:22px;line-height:1.9">${Gen.ymd(oneYear)}</div></div>`;

  // 预览只放第 1 个人的 42 行，100 人全铺开没法看；其余人格式完全一样
  if (!people.length) {
    $('#pv').innerHTML = '<div class="empty">粘好名单，这里就会出现预览</div>';
    $('#pvHint').textContent = '';
  } else {
    const rows = Gen.buildRows(people.slice(0, 1), opt);
    $('#pvHint').textContent = people.length > 1 ? `只列第 1 人，其余 ${people.length - 1} 人格式一样，券号换成各自手机号` : '';
    let h = '<table><thead><tr><th>活动名称</th><th>代金券号</th><th>券面值</th><th>可使用对象</th><th>对象编号</th><th>会员编号</th><th>开始日期</th><th>截至日期</th><th>取价规则</th><th>使用场景</th><th>需购满额</th></tr></thead><tbody>';
    h += `<tr class="grp"><td colspan="11">${esc(people[0].name || '（未填姓名）')}<span class="ph">${people[0].phone}</span></td></tr>`;
    rows.forEach(r => {
      h += `<tr class="${r.val === 15 ? 'wash' : ''}"><td>${r.act}</td><td class="num">${r.no}</td><td class="num">${r.val}</td><td>${r.obj}</td><td>${r.objNo}</td><td class="num">${r.phone}</td><td class="num">${Gen.ymd(r.s)}</td><td class="num">${Gen.ymd(r.e)}</td><td>${r.rule}</td><td>${r.scene}</td><td class="num">${r.min}</td></tr>`;
    });
    $('#pv').innerHTML = h + '</tbody></table>';
  }

  $('#go').disabled = !people.length;
  $('#fn').textContent = !people.length ? '还没有可用的手机号' :
    (issues.length ? `有 ${issues.length} 行没识别，导出时不含 · ` : '') + Gen.fileName(people, date);
  return { opt };
}

// 读 Excel：每行把所有格子拼成一行文本，交给同一个识别逻辑
function readFile(f) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const lines = [];
      wb.SheetNames.forEach(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' })
        .forEach(row => { const t = row.map(c => String(c).trim()).filter(Boolean).join(' '); if (t) lines.push(t); }));
      $('#txt').value = lines.join('\n');
      update();
      toast(`读到 ${people.length} 人`);
    } catch (err) { toast('这个文件读不了，换成 .xlsx 试试'); }
  };
  r.readAsArrayBuffer(f);
}

let tmr;
$('#txt').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(update, 120); });
$('#file').onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ''; };
$('#clear').onclick = () => { $('#txt').value = ''; update(); $('#txt').focus(); };
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); drop.classList.add('over'); } }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) { e.preventDefault(); readFile(e.dataTransfer.files[0]); } });
$('#date').oninput = update;
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
  mode = b.dataset.v;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
  update();
});
$('#go').onclick = () => {
  const { opt } = update();
  if (!people.length) return;
  const { wb } = Gen.buildWorkbook(XLSX, people, opt);
  XLSX.writeFile(wb, Gen.fileName(people, opt.date), { bookType: 'biff8' });
  toast('已导出，在「下载」文件夹');
};

let tt;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

update();
</script>
</body>
</html>
